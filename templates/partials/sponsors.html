{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="section sponsors">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Proudly supported by</p>
      <h2 class="title">Our sponsors</h2>
      <p>Our sponsors help keep fees down and our players on the court. Please support the local businesses that support us.</p>
    </div>
    <ul class="sponsor-logos">
      <li><img src="{=site.image('sponsors/community-bank-mt-eliza.png')}" alt="Bendigo Bank Mount Eliza" loading="lazy" width="1182" height="532"></li>
      <li><img src="{=site.url('images/uploads/images-3.png')}" alt="The Golf Clearance Outlet" loading="lazy" width="392" height="98"></li>
      <li><img src="{=site.image('sponsors/steadfast-logistics.png')}" alt="Steadfast Logistics" loading="lazy" width="800" height="396"></li>
      <li class="dark"><img src="{=site.url('images/uploads/site-logo-white.svg')}" alt="Robinson Voss Partners" loading="lazy" width="204" height="107"></li>
    </ul>
    <p class="sponsor-more"><a href="{=site.url('sponsors')}">Meet our sponsors</a></p>
  </div>
</section>
