{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="section sponsors">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Proudly supported by</p>
      <h2 class="title">Our sponsors</h2>
      <p>Our sponsors help keep fees down and our players on the court. Please support the local businesses that support us.</p>
    </div>
    <ul class="sponsor-logos">
      <li class="lg"><img src="{=site.image('sponsors/community-bank-mt-eliza.png')}" alt="Bendigo Bank Mount Eliza" loading="lazy" width="1182" height="532"></li>
      <li><img src="{=site.url('images/uploads/gco-logo-2020-resize.png')}" alt="The Golf Clearance Outlet" loading="lazy" width="900" height="168"></li>
      <li><img src="{=site.image('sponsors/steadfast-logistics.svg')}" alt="Steadfast Logistics" loading="lazy" width="320" height="96"></li>
      <li><img src="{=site.image('sponsors/robinson-voss-partners.jpg')}" alt="Robinson Voss Partners" loading="lazy" width="250" height="110"></li>
    </ul>
    <p class="sponsor-more"><a href="{=site.url('sponsors')}">Meet our sponsors</a></p>
  </div>
</section>
